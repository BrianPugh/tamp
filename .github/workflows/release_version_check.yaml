name: Release Version Check

# Fails a release tag that wasn't made with `bump-my-version bump`, which would
# leave version strings in committed files (README install URLs, etc.) stale.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  check:
    name: 'Versioned files match tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bump-my-version current_version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['bumpversion']['current_version'])")
          if [ "$CURRENT_VERSION" != "$TAG_VERSION" ]; then
            echo "pyproject.toml [tool.bumpversion] current_version ($CURRENT_VERSION) does not match tag ($TAG_VERSION)." >&2
            echo "Release with 'uv run bump-my-version bump {major,minor,patch}' instead of tagging by hand." >&2
            exit 1
          fi
          for f in README.md docs/source/Installation.rst; do
            if ! grep -qF "releases/download/v${TAG_VERSION}/tamp-${TAG_VERSION}-" "$f"; then
              echo "$f does not reference the v${TAG_VERSION} release assets." >&2
              exit 1
            fi
          done
