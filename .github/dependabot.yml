# Lockfile-only: bump the pinned versions without raising the minimum
# versions in pyproject.toml / package.json, which would only restrict users.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'lockfile-only'
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/wasm'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'lockfile-only'
    groups:
      wasm:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/website'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'lockfile-only'
    groups:
      website:
        patterns: ['*']
